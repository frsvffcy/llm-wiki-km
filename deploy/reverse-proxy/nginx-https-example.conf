# Mode 2 public HTTPS reverse-proxy example (#418 §D).
#
# CANDIDATE ONLY: this contract is explicit but NOT supported. Public HTTPS
# stays unsupported until a future adoption completes the remaining Security
# and Operations work. In particular this file never replaces the
# application-owned owner session (#417) and never exposes the raw backend:
# the proxy is the only TLS termination point and the application keeps its
# loopback backend at 127.0.0.1:8765.
#
# Replace proxy.example.net with the real hostname, install a real
# certificate, and register that hostname in OWNER_ALLOWED_HOSTS /
# OWNER_ALLOWED_ORIGINS. Arbitrary forwarded or identity headers are never
# trusted; only the configured trusted ingress may set them (see
# OWNER_TRUSTED_PROXIES + OWNER_TRUST_PROXY_HEADERS).

server {
  listen 443 ssl;
  server_name proxy.example.net;

  ssl_certificate     /etc/nginx/tls/proxy.example.net.fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/proxy.example.net.privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  # Safe diagnostics surface: log without request bodies or secrets.
  access_log /var/log/nginx/llm-wiki-km-access.log combined;
  error_log  /var/log/nginx/llm-wiki-km-error.log warn;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  # Health/readiness may be probed through the proxy; it carries no secrets,
  # paths, or provider material by contract.
  location = /api/v1/system/deployment {
    proxy_pass http://127.0.0.1:8765;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /api/v1/ {
    proxy_pass http://127.0.0.1:8765;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Do NOT invent identity headers here: the application never trusts
    # client-supplied proxy metadata unless the ingress is allowlisted.
  }

  location / {
    proxy_pass http://127.0.0.1:8765;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
}

# Plain HTTP exists only to redirect to TLS; it serves no application bytes.
server {
  listen 80;
  server_name proxy.example.net;
  return 301 https://$host$request_uri;
}
