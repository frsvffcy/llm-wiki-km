spring:
  application:
    name: llm-wiki-km
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:100MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:200MB}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jooq:
    sql-dialect: SQLITE

app:
  ai:
    embedding:
      enabled: ${EMBEDDING_PROVIDER_ENABLED:false}
      provider: ${EMBEDDING_PROVIDER:openai-compatible}
      base-url: ${EMBEDDING_PROVIDER_BASE_URL:https://api.openai.com/v1}
      allow-insecure-transport: ${EMBEDDING_PROVIDER_ALLOW_INSECURE_TRANSPORT:false}
      model: ${EMBEDDING_PROVIDER_MODEL:}
      api-key: ${EMBEDDING_PROVIDER_API_KEY:}
      connect-timeout: ${EMBEDDING_PROVIDER_CONNECT_TIMEOUT:2s}
      read-timeout: ${EMBEDDING_PROVIDER_READ_TIMEOUT:15s}
      dimension: ${EMBEDDING_PROVIDER_DIMENSION:0}
    answer:
      enabled: ${ANSWER_PROVIDER_ENABLED:false}
      provider: ${ANSWER_PROVIDER:openai-compatible}
      base-url: ${ANSWER_PROVIDER_BASE_URL:https://api.openai.com/v1}
      allow-insecure-transport: ${ANSWER_PROVIDER_ALLOW_INSECURE_TRANSPORT:false}
      model: ${ANSWER_PROVIDER_MODEL:}
      api-key: ${OPENAI_API_KEY:}
      connect-timeout: ${ANSWER_PROVIDER_CONNECT_TIMEOUT:2s}
      read-timeout: ${ANSWER_PROVIDER_READ_TIMEOUT:15s}
      max-output-tokens: ${ANSWER_PROVIDER_MAX_OUTPUT_TOKENS:4000}
      temperature: ${ANSWER_PROVIDER_TEMPERATURE:0.0}
      context:
        compaction:
          policy-version: ${ANSWER_CONTEXT_COMPACTION_POLICY_VERSION:context-policy-v1-current}
    query-transformation:
      policy-version: ${QUERY_TRANSFORMATION_POLICY_VERSION:query-transform-disabled-v1}
      provider:
        enabled: ${QUERY_REWRITE_PROVIDER_ENABLED:false}
        provider: ${QUERY_REWRITE_PROVIDER:openai-compatible}
        base-url: ${QUERY_REWRITE_PROVIDER_BASE_URL:https://api.openai.com/v1}
        allow-insecure-transport: ${QUERY_REWRITE_PROVIDER_ALLOW_INSECURE_TRANSPORT:false}
        model: ${QUERY_REWRITE_PROVIDER_MODEL:}
        api-key: ${QUERY_REWRITE_PROVIDER_API_KEY:}
        connect-timeout: ${QUERY_REWRITE_PROVIDER_CONNECT_TIMEOUT:2s}
        read-timeout: ${QUERY_REWRITE_PROVIDER_READ_TIMEOUT:10s}
  extraction:
    resource:
      max-input-bytes: ${EXTRACTION_MAX_INPUT_BYTES:52428800}
      max-output-characters: ${EXTRACTION_MAX_OUTPUT_CHARACTERS:5000000}
      max-metadata-characters: ${EXTRACTION_MAX_METADATA_CHARACTERS:100000}
    scanned-pdf:
      minimum-text-characters: ${EXTRACTION_SCANNED_PDF_MINIMUM_TEXT_CHARACTERS:50}
    normalization:
      # #412 versioned policy: v2-selected-cf-strip is the production default (GO subset
      # from #380). Rollback = set EXTRACTION_NORMALIZATION_POLICY_VERSION to
      # normalization-policy-v1-current AND re-extract affected documents; changing the
      # version alone never rewrites historical bytes in place.
      policy-version: ${EXTRACTION_NORMALIZATION_POLICY_VERSION:normalization-policy-v2-selected-cf-strip}
      repeated-header-footer-enabled: ${EXTRACTION_REPEATED_HEADER_FOOTER_ENABLED:true}
      repeated-header-footer-minimum-occurrences: ${EXTRACTION_REPEATED_HEADER_FOOTER_MINIMUM_OCCURRENCES:2}
  graph:
    projection:
      enabled: ${GRAPH_PROJECTION_ENABLED:false}
      provider: ${GRAPH_PROJECTION_PROVIDER:arcadedb}
      path: ${GRAPH_PROJECTION_PATH:data/graph}
  persistence:
    sqlite:
      path: ${KNOWLEDGE_DB_PATH:data/knowledge.db}
      busy-timeout: ${SQLITE_BUSY_TIMEOUT_MS:5000}
  search:
    vector:
      enabled: ${VECTOR_CAPABILITY_ENABLED:false}
      extension-path: ${VECTOR_EXTENSION_PATH:}
      required-extension-version: ${VECTOR_EXTENSION_VERSION:v0.1.9}
  mcp:
    enabled: ${MCP_ADAPTER_ENABLED:false}
    auth-token: ${MCP_ADAPTER_AUTH_TOKEN:}
    max-body-bytes: ${MCP_ADAPTER_MAX_BODY_BYTES:262144}
  owner:
    # #417 single-user owner security boundary. Disabled by default: local-only
    # keeps the #393 localhost trust model with every /api/v1 endpoint open.
    # Enabling without a valid 64-hex SHA-256 password hash fails fast at startup.
    # Enabling never changes server.address (still 127.0.0.1) and never adds
    # multi-user, tenant, or organization schema.
    auth-enabled: ${OWNER_AUTH_ENABLED:false}
    password-hash: ${OWNER_PASSWORD_HASH:}
    session-absolute-timeout: ${OWNER_SESSION_ABSOLUTE_TIMEOUT:12h}
    session-idle-timeout: ${OWNER_SESSION_IDLE_TIMEOUT:30m}
    max-sessions: ${OWNER_MAX_SESSIONS:8}
    cookie-secure: ${OWNER_COOKIE_SECURE:true}
    cookie-name: ${OWNER_COOKIE_NAME:km-owner-session}
    allowed-hosts: ${OWNER_ALLOWED_HOSTS:localhost,127.0.0.1}
    allowed-origins: ${OWNER_ALLOWED_ORIGINS:http://localhost:8765,http://127.0.0.1:8765}
    trusted-proxies: ${OWNER_TRUSTED_PROXIES:}
    trust-proxy-headers: ${OWNER_TRUST_PROXY_HEADERS:false}
    login-max-attempts: ${OWNER_LOGIN_MAX_ATTEMPTS:5}
    login-window: ${OWNER_LOGIN_WINDOW:1m}
    mutation-max-requests: ${OWNER_MUTATION_MAX_REQUESTS:60}
    mutation-window: ${OWNER_MUTATION_WINDOW:1m}
  deployment:
    # #418 single-instance Remote Personal Deployment profile. LOCAL_ONLY is the
    # default/supported baseline. PRIVATE_INGRESS (Mode 1) requires explicit
    # bounded forwarder binds plus owner authentication and keeps the raw backend
    # on the loopback listener. REVERSE_PROXY_CANDIDATE (Mode 2) is never
    # reported SUPPORTED by this operations contract. The backend bind below
    # stays loopback-only; remote traffic must arrive via host-local forwarding.
    mode: ${DEPLOYMENT_MODE:LOCAL_ONLY}
    forwarder-binds: ${DEPLOYMENT_FORWARDER_BINDS:}
    forwarder-target: ${DEPLOYMENT_FORWARDER_TARGET:127.0.0.1:8765}
    max-instances: ${DEPLOYMENT_MAX_INSTANCES:1}
  rag:
    fusion:
      policy-version: ${KM_RAG_FUSION_POLICY_VERSION:fusion-rrf-v2-graph-damped}
    rerank:
      policy-version: ${KM_RAG_RERANK_POLICY_VERSION:rerank-policy-v1-exact-anchor}

server:
  address: 127.0.0.1
  port: 8765
