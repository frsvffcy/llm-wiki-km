# ArcadeDB embedded mode writes through the application console. The project deliberately omits
# the vendor default FileHandler so starting a derived projection never creates an unmanaged
# ./log directory outside the configured knowledge-root layout.
handlers = java.util.logging.ConsoleHandler
.level = INFO
com.arcadedb.level = INFO
java.util.logging.ConsoleHandler.level = INFO
java.util.logging.ConsoleHandler.formatter = com.arcadedb.utility.AnsiLogFormatter
