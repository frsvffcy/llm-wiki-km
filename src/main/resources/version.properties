# Application version single authority (Refs #456 R1).
#
# This file is the ONLY generated version truth for the runtime:
# Maven resource filtering writes the pom project version into the
# app.version property below at build time. No Java source may hardcode
# the release version as a second truth; SystemStatusService reads it
# through system.ApplicationVersion (which cross-checks the packaged JAR
# manifest Implementation-Version when present).
app.version=@project.version@
