name: PR CI

on:
  pull_request:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-metadata:
    name: PR metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run PR metadata guard tests
        run: node --test src/test/js/pr-metadata.test.mjs src/test/js/merge-settings.test.mjs src/test/js/merge-commit-guard.test.mjs
      - name: Validate PR base, title and Issue linkage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/validate-pr-metadata.mjs
      - name: Audit repository merge settings contract
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/audit-merge-settings.mjs

  fast-tests:
    name: Fast unit and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Browser Ask UI contract tests
        run: node --test src/test/js/ask-ui.test.mjs
      - name: Run Browser navigation shell contract tests
        run: node --test src/test/js/navigation-ui.test.mjs
      - name: Run Browser workspace UI contract tests
        run: node --test src/test/js/workspace-ui.test.mjs
      - name: Run Browser inbox UI contract tests
        run: node --test src/test/js/inbox-ui.test.mjs
      - name: Run Browser review workbench UI contract tests
        run: node --test src/test/js/review-ui.test.mjs
      - name: Run Browser Graph operations UI contract tests
        run: node --test src/test/js/graph-operations-ui.test.mjs
      - name: Run Browser Retrieval Inspector UI contract tests
        run: node --test src/test/js/retrieval-inspector-ui.test.mjs
      - name: Run Browser Source Chunk Inspector UI contract tests
        run: node --test src/test/js/source-chunk-inspector-ui.test.mjs
      - name: Run Browser Retrieval Inspector UI contract tests
        run: node --test src/test/js/retrieval-inspector-ui.test.mjs
      - name: Run Browser Source Chunk inspector UI contract tests
        run: node --test src/test/js/source-chunk-inspector-ui.test.mjs
      - name: Run fast test tier
        run: mvn --batch-mode test -Pfast

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run integration test tier
        run: mvn --batch-mode test -Pintegration

  graph-adapter-smoke:
    name: Production ArcadeDB graph adapter smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 驗證 Linux production ArcadeDB lifecycle、canonical ingress、bounded traversal、graph evidence admission 與資源契約
        run: >-
          mvn --batch-mode
          -Dtest=ArcadeDbGraphProjectionLifecycleIntegrationTest,ArcadeDbGraphProjectionBackendFactoryTest,CanonicalGraphIngressIntegrationTest,ArcadeDbGraphTraversalTest,CanonicalGraphTraversalIntegrationTest,GraphEvidenceAdmissionIntegrationTest,GraphProjectionOperationalApiIntegrationTest
          test

  build-integrity:
    name: Build integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check diff whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"
      - name: Run clean Flyway, jOOQ, compile, package and verify gate
        run: mvn --batch-mode clean verify -Pbuild-integrity
      - name: Upload package artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-integrity-artifacts
          path: |
            target/*.jar
          if-no-files-found: ignore

  sqlite-vec-smoke:
    name: sqlite-vec JDBC smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run pinned sqlite-vec JDBC smoke on Linux
        run: |
          curl --fail --location --silent --show-error \
            --output sqlite-vec-linux.tgz \
            https://github.com/asg017/sqlite-vec/releases/download/v0.1.9/sqlite-vec-0.1.9-loadable-linux-x86_64.tar.gz
          echo "b959baa1d8dc88861b1edb337b8587178cdcb12d60b4998f9d10b6a82052d5d7  sqlite-vec-linux.tgz" | sha256sum --check
          mkdir -p target/sqlite-vec-linux
          tar --extract --gzip --file sqlite-vec-linux.tgz --directory target/sqlite-vec-linux
          chmod +x scripts/sqlite-vec-jdbc-smoke.sh
          scripts/sqlite-vec-jdbc-smoke.sh target/sqlite-vec-linux/vec0.so
  pr-gate:
    name: PR Gate
    if: ${{ always() }}
    needs:
      - pr-metadata
      - fast-tests
      - integration-tests
      - graph-adapter-smoke
      - build-integrity
      - sqlite-vec-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required CI jobs succeeded
        if: ${{ needs.pr-metadata.result == 'success' && needs.fast-tests.result == 'success' && needs.integration-tests.result == 'success' && needs.graph-adapter-smoke.result == 'success' && needs.build-integrity.result == 'success' && needs.sqlite-vec-smoke.result == 'success' }}
        run: echo "PR Metadata, Fast, Integration, production ArcadeDB Graph Adapter, Build Integrity, and sqlite-vec Smoke CI jobs all succeeded."
      - name: Reject incomplete required CI jobs
        if: ${{ needs.pr-metadata.result != 'success' || needs.fast-tests.result != 'success' || needs.integration-tests.result != 'success' || needs.graph-adapter-smoke.result != 'success' || needs.build-integrity.result != 'success' || needs.sqlite-vec-smoke.result != 'success' }}
        env:
          PR_METADATA_RESULT: ${{ needs.pr-metadata.result }}
          FAST_RESULT: ${{ needs.fast-tests.result }}
          INTEGRATION_RESULT: ${{ needs.integration-tests.result }}
          GRAPH_ADAPTER_RESULT: ${{ needs.graph-adapter-smoke.result }}
          BUILD_INTEGRITY_RESULT: ${{ needs.build-integrity.result }}
          SQLITE_VEC_RESULT: ${{ needs.sqlite-vec-smoke.result }}
        run: |
          echo "PR metadata: ${PR_METADATA_RESULT}"
          echo "Fast unit and contract tests: ${FAST_RESULT}"
          echo "Integration tests: ${INTEGRATION_RESULT}"
          echo "Production ArcadeDB graph adapter smoke: ${GRAPH_ADAPTER_RESULT}"
          echo "Build integrity: ${BUILD_INTEGRITY_RESULT}"
          echo "sqlite-vec JDBC smoke: ${SQLITE_VEC_RESULT}"
          echo "PR Gate requires every upstream CI job to succeed."
          exit 1
