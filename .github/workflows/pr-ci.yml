name: PR CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fast-tests:
    name: Fast unit and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Browser Ask UI contract tests
        run: node --test src/test/js/ask-ui.test.mjs
      - name: Run fast test tier
        run: mvn --batch-mode test -Pfast

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run integration test tier
        run: mvn --batch-mode test -Pintegration

  full-build-integrity:
    name: Full regression and build integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check diff whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"
      - name: Run clean full regression, Flyway, jOOQ and package gate
        run: mvn --batch-mode clean verify -Pfull
      - name: Upload Surefire reports and package artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-build-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/*.jar
          if-no-files-found: ignore
